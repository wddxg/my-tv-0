name: build-kitkat

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="dev-$(git rev-parse --short HEAD)"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "version: $V"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ALIAS }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          APK_IN=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)
          test -n "$APK_IN"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          echo "using build tools: $BUILD_TOOLS"
          KS="$RUNNER_TEMP/mytv0-signing.jks"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            STOREPASS="$KEYSTORE_PASSWORD"
            KEYPASS="$ALIAS_PASSWORD"
            KEYALIAS="$SECRET_ALIAS"
            echo "signing with the keystore from repository secrets"
          else
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
              -alias mytv0 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mytv0pass -keypass mytv0pass \
              -dname "CN=my-tv-0 kitkat, OU=Personal, O=Personal, L=CN, ST=CN, C=CN"
            STOREPASS=mytv0pass
            KEYPASS=mytv0pass
            KEYALIAS=mytv0
            echo "no signing secrets found: generated a one-off keystore for this build"
          fi

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" --ks-key-alias "$KEYALIAS" \
            --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "my-tv-0_${APP_VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "my-tv-0_${APP_VERSION}.apk"
          ls -lh "my-tv-0_${APP_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-tv-0-kitkat-apk
          path: my-tv-0_*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="my-tv-0_${APP_VERSION}.apk"
          NOTES="安卓 4.4 兼容版本（简体中文 / 允许明文 HTTP）。构建提交：${GITHUB_SHA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Release $TAG" --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,tagName --jq '.url'
